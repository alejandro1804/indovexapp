name: indovexapp
description: "IndovexApp - Gestión Industrial y Mantenimiento"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.5.0
  provider: ^6.1.2
  go_router: ^13.2.0
  cached_network_image: ^3.3.1
  image_picker: ^1.2.2
  intl: ^0.19.0
  cupertino_icons: ^1.0.8
  flutter_native_splash: ^2.4.8
  url_launcher: ^6.3.2
  file_picker: ^8.1.2
  mime: ^1.0.5
  pdf: ^3.11.1
  printing: ^5.13.4
  flutter_image_compress: ^2.4.0
  qr_flutter: ^4.1.0
  app_links: ^6.3.2
  mobile_scanner: ^5.2.3
  barcode: ^2.2.9
  fl_chart: ^0.69.0
  package_info_plus: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#1F4E79"
  adaptive_icon_foreground: "assets/icon/icon.png"

flutter_native_splash:
  color: "#1F4E79"
  image: assets/icon/icon.png
  color_dark: "#1F4E79"
  image_dark: assets/icon/icon.png
  android_12:

flutter:
  uses-material-design: true
  assets:
    - assets/icon/