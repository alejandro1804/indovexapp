<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 680">
    <style>
        .bg { fill: #1F4E79; }
        .gear-outer { fill: #2E75B6; }
        .gear-inner { fill: #1F4E79; }
        .accent { fill: #00C9A7; }
        .accent2 { fill: #4FC3F7; }
        .logo-text { font-family: system-ui, sans-serif; font-weight: 700; fill: #FFFFFF; }
        .logo-sub { font-family: system-ui, sans-serif; font-weight: 400; fill: #90CAF9; letter-spacing: 3px; }
    </style>
    <rect x="100" y="100" width="480" height="480" rx="80" class="bg"/>
    <g transform="translate(340,300)">
        <g class="gear-outer">
            <rect x="-18" y="-165" width="36" height="44" rx="6"/>
            <rect x="-18" y="121" width="36" height="44" rx="6"/>
            <rect x="121" y="-18" width="44" height="36" rx="6"/>
            <rect x="-165" y="-18" width="44" height="36" rx="6"/>
            <rect x="75" y="-135" width="36" height="44" rx="6" transform="rotate(45)"/>
            <rect x="75" y="-135" width="36" height="44" rx="6" transform="rotate(90)"/>
            <rect x="75" y="-135" width="36" height="44" rx="6" transform="rotate(135)"/>
            <rect x="75" y="-135" width="36" height="44" rx="6" transform="rotate(180)"/>
            <rect x="75" y="-135" width="36" height="44" rx="6" transform="rotate(225)"/>
            <rect x="75" y="-135" width="36" height="44" rx="6" transform="rotate(270)"/>
            <rect x="75" y="-135" width="36" height="44" rx="6" transform="rotate(315)"/>
